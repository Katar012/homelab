name: homelab-sftpgo

services:
  sftpgo:
    image: drakkan/sftpgo:v2.7.6
    # Only the systemd service starts the container after checking the HDD.
    restart: "no"
    ports:
      - "127.0.0.1:8080:8081"
      - "${LAN_IP:?Run service-sftpgo.sh install first}:2022:2022"
      - "${LAN_IP:?Run service-sftpgo.sh install first}:8443:8443"
    volumes:
      - type: bind
        source: ./state
        target: /srv/sftpgo
        bind:
          create_host_path: false
      - type: bind
        source: ./config
        target: /var/lib/sftpgo
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/homelab-hdd/sftpgo-data
        target: /srv/sftpgo/data
        bind:
          create_host_path: false
    environment:
      SFTPGO_GRACE_TIME: "20"
      # HTTPS WebClient, no WebAdmin on the LAN listener.
      SFTPGO_HTTPD__BINDINGS__0__PORT: "8443"
      SFTPGO_HTTPD__BINDINGS__0__ADDRESS: "0.0.0.0"
      SFTPGO_HTTPD__BINDINGS__0__ENABLE_WEB_ADMIN: "false"
      SFTPGO_HTTPD__BINDINGS__0__ENABLE_WEB_CLIENT: "true"
      SFTPGO_HTTPD__BINDINGS__0__ENABLE_REST_API: "true"
      SFTPGO_HTTPD__BINDINGS__0__DISABLED_LOGIN_METHODS: "80"
      SFTPGO_HTTPD__BINDINGS__0__ENABLE_HTTPS: "true"
      SFTPGO_HTTPD__BINDINGS__0__CERTIFICATE_FILE: "/var/lib/sftpgo/certs/webclient.crt"
      SFTPGO_HTTPD__BINDINGS__0__CERTIFICATE_KEY_FILE: "/var/lib/sftpgo/certs/webclient.key"
      # HTTP WebAdmin, published on the HOST loopback interface only.
      SFTPGO_HTTPD__BINDINGS__1__PORT: "8081"
      SFTPGO_HTTPD__BINDINGS__1__ADDRESS: "0.0.0.0"
      SFTPGO_HTTPD__BINDINGS__1__ENABLE_WEB_ADMIN: "true"
      SFTPGO_HTTPD__BINDINGS__1__ENABLE_WEB_CLIENT: "false"
      SFTPGO_HTTPD__BINDINGS__1__ENABLE_REST_API: "true"
      SFTPGO_HTTPD__BINDINGS__1__DISABLE_AUTO_TLS: "true"
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
